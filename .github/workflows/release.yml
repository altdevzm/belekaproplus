name: Release Beleka POS (Windows & Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*'
      - 'v*'
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.1)'
        required: true
        default: '2.0.1'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Create a draft release
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag:     ${{ steps.meta.outputs.tag }}

    steps:
      - name: Resolve version & tag
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            VER="2.0.1"
            TAG="v2.0.1"

          elif [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER="${{ inputs.version }}"
            TAG="v${VER}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG"     >> $GITHUB_OUTPUT

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Beleka POS ${{ steps.meta.outputs.tag }}"
          draft: true
          body: |
            ## 🏪 Beleka POS — ${{ steps.meta.outputs.tag }}

            ### 📦 Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | 🪟 Windows | `Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe` | Standalone installer for Windows 8, 8.1, 10, and 11 |
            | 📱 Android | `Beleka_POS_v${{ steps.meta.outputs.version }}.apk` | Universal APK for Android phones, tablets, and POS devices |

            ### 🚀 Installation Guide
            - **Windows**: Download and run `Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe` as Administrator.
            - **Android**: Download and install `Beleka_POS_v${{ steps.meta.outputs.version }}.apk` on your mobile/tablet POS.

            ---
            *Built automatically by GitHub Actions · `${{ github.sha }}`*

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build Windows installer (Windows 8, 8.1, 10, 11)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ needs.create-release.outputs.version }}

      - name: Copy MSVC runtime DLLs
        shell: pwsh
        run: |
          $target = "build\windows\x64\runner\Release"
          $dlls = @(
            "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll",
            "msvcp140_1.dll", "msvcp140_2.dll", "vcomp140.dll", "concrt140.dll"
          )
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) { Copy-Item $src $target -Force; Write-Host "Copied $dll" }
          }
          Write-Host "MSVC runtime DLLs bundled."

      - name: Download Official Microsoft Visual C++ Redistributable
        shell: pwsh
        run: |
          $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          Invoke-WebRequest -Uri $vcRedistUrl -OutFile "windows\vc_redist.x64.exe"
          Write-Host "Downloaded Microsoft vc_redist.x64.exe for Inno Setup installer bundling."

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $ver  = "${{ needs.create-release.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          (Get-Content "windows\installer.iss") `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" |
            Set-Content "windows\installer.iss"
          New-Item -ItemType Directory -Path "build\windows\installer" -Force | Out-Null
          & $iscc "windows\installer.iss"
          Write-Host "Built: Beleka_POS_Setup_v$ver.exe"

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: build/windows/installer/Beleka_POS_Setup_v${{ needs.create-release.outputs.version }}.exe

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build Android APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --build-name=${{ needs.create-release.outputs.version }}

      - name: Stage Android APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Beleka_POS_v${{ needs.create-release.outputs.version }}.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: Beleka_POS_v${{ needs.create-release.outputs.version }}.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Publish the release + version.json (OTA update manifest)
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [create-release, build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version.json (OTA update manifest)
        run: |
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag }}"
          BASE="https://github.com/altdevzm/belekapro/releases/download/${TAG}"

          # Extract release notes from pubspec or CHANGELOG if present
          NOTES=$(git log --oneline -10 --pretty=format:"• %s" 2>/dev/null | head -5 || echo "Bug fixes and improvements.")

          cat > version.json << EOF
          {
            "version": "${VER}",
            "tag": "${TAG}",
            "required": false,
            "windows_url": "${BASE}/Beleka_POS_Setup_v${VER}.exe",
            "android_url": "${BASE}/Beleka_POS_v${VER}.apk",
            "release_notes": "$(echo "$NOTES" | tr '\n' ' ' | sed 's/"/\\"/g')",
            "min_version": "1.0.0",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "Generated version.json:"
          cat version.json

      - name: Upload version.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: version.json

      - name: Publish (undraft) release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false

