name: Release Beleka POS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Create a draft release so build jobs can attach assets directly
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag:     ${{ steps.meta.outputs.tag }}

    steps:
      - name: Resolve version & tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER="${{ inputs.version }}"
            TAG="v${VER}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG"     >> $GITHUB_OUTPUT

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Beleka POS ${{ steps.meta.outputs.tag }}"
          draft: true
          body: |
            ## 🏪 Beleka POS — ${{ steps.meta.outputs.tag }}

            ### 📦 Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | 🪟 Windows | `Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe` | Run as Administrator · creates Desktop & Start Menu shortcut |
            | 🐧 Linux   | `Beleka_POS_Linux_v${{ steps.meta.outputs.version }}.tar.gz` | Extract and run `./beleka_pos` |

            ### 🚀 Windows Installation
            1. Download `Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe`
            2. Right-click → **Run as administrator**
            3. If Windows SmartScreen appears: **More info → Run anyway**
            4. Follow the setup wizard — shortcut created on Desktop

            ### 🐧 Linux Installation
            ```bash
            tar -xzf Beleka_POS_Linux_v${{ steps.meta.outputs.version }}.tar.gz
            chmod +x beleka_pos
            ./beleka_pos
            ```

            ---
            *Built automatically by GitHub Actions · `${{ github.sha }}`*

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build Windows installer and upload directly to the draft release
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ needs.create-release.outputs.version }}

      - name: Copy MSVC runtime & UCRT DLLs (Windows 8, 8.1, 10, 11 support)
        shell: pwsh
        run: |
          $target = "build\windows\x64\runner\Release"
          $dlls = @(
            "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll",
            "msvcp140_1.dll", "msvcp140_2.dll", "vcomp140.dll", "concrt140.dll",
            "ucrtbase.dll"
          )
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) { Copy-Item $src $target -Force; Write-Host "Copied $dll" }
          }
          # Copy api-ms-win-crt runtime DLLs for Windows 8/8.1 out-of-the-box support
          Get-ChildItem "C:\Windows\System32\api-ms-win-crt-*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName $target -Force
          }
          Get-ChildItem "C:\Windows\System32\api-ms-win-core-*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName $target -Force
          }
          Write-Host "All Windows 8-11 compatibility DLLs bundled successfully."

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $ver  = "${{ needs.create-release.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          (Get-Content "windows\installer.iss") `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" |
            Set-Content "windows\installer.iss"
          New-Item -ItemType Directory -Path "build\windows\installer" -Force | Out-Null
          & $iscc "windows\installer.iss"
          Write-Host "Built: Beleka_POS_Setup_v$ver.exe"

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: build/windows/installer/Beleka_POS_Setup_v${{ needs.create-release.outputs.version }}.exe

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build Linux bundle and upload directly to the draft release
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Bundle
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release --build-name=${{ needs.create-release.outputs.version }}

      - name: Package bundle
        run: |
          VER="${{ needs.create-release.outputs.version }}"
          cd build/linux/x64/release/bundle
          tar -czf "../../../../../Beleka_POS_Linux_v${VER}.tar.gz" .

      - name: Upload bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: Beleka_POS_Linux_v${{ needs.create-release.outputs.version }}.tar.gz

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Publish the draft release once both builds succeed
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [create-release, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Publish (undraft) release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false
