name: Release Beleka POS

on:
  push:
    tags:
      - 'v*.*.*'   # e.g. v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Build Windows EXE installer (Inno Setup)
  # ─────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = "${{ inputs.version }}"
          }
          echo "value=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ steps.version.outputs.value }}

      - name: Copy MSVC runtime DLLs
        shell: pwsh
        run: |
          $target = "build\windows\x64\runner\Release"
          $dlls = @(
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll"
          )
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) {
              Copy-Item $src -Destination $target -Force
              Write-Host "Copied $dll"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "innosetup.exe"
          Start-Process -Wait -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          
          # Patch version in installer script
          (Get-Content "windows\installer.iss") `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" |
            Set-Content "windows\installer.iss"
          
          # Create output directory
          New-Item -ItemType Directory -Path "build\windows\installer" -Force | Out-Null
          
          & $iscc "windows\installer.iss"
          Write-Host "Built: Beleka_POS_Setup_v$version.exe"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/installer/Beleka_POS_Setup_v${{ steps.version.outputs.value }}.exe
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # 2. Build Linux bundle
  # ─────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
          else
            VER="${{ inputs.version }}"
          fi
          echo "value=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release --build-name=${{ steps.version.outputs.value }}

      - name: Package Linux bundle
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cd build/linux/x64/release/bundle
          tar -czf "../../../../../Beleka_POS_Linux_v${VERSION}.tar.gz" .
          echo "Packaged Beleka_POS_Linux_v${VERSION}.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: Beleka_POS_Linux_v${{ steps.version.outputs.value }}.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # 3. Create GitHub Release
  # ─────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version & tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER="${{ inputs.version }}"
            TAG="v${VER}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: dist/

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Beleka POS ${{ steps.meta.outputs.tag }}"
          body: |
            ## 🏪 Beleka POS — ${{ steps.meta.outputs.tag }}

            ### 📦 Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | 🪟 Windows | `Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe` | Run the installer — creates Desktop & Start Menu shortcut |
            | 🐧 Linux | `Beleka_POS_Linux_v${{ steps.meta.outputs.version }}.tar.gz` | Extract and run `./beleka_pos` |

            ### 🚀 Windows Installation
            1. Download `Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe`
            2. Run as Administrator *(right-click → Run as administrator)*
            3. If Windows SmartScreen appears: click **More info → Run anyway**
            4. Follow the setup wizard and launch from the Desktop shortcut

            ### 🐧 Linux Installation
            ```bash
            tar -xzf Beleka_POS_Linux_v${{ steps.meta.outputs.version }}.tar.gz
            chmod +x beleka_pos
            ./beleka_pos
            ```

            ---
            *Built automatically by GitHub Actions · Commit: `${{ github.sha }}`*
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe
            dist/Beleka_POS_Linux_v${{ steps.meta.outputs.version }}.tar.gz
