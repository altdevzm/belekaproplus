name: Release Beleka POS (Windows Only)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.5)'
        required: true
        default: '1.1.5'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Create a draft release
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag:     ${{ steps.meta.outputs.tag }}

    steps:
      - name: Resolve version & tag
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            VER="1.1.5"
            TAG="v1.1.5"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER="${{ inputs.version }}"
            TAG="v${VER}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG"     >> $GITHUB_OUTPUT

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Beleka POS ${{ steps.meta.outputs.tag }}"
          draft: true
          body: |
            ## 🏪 Beleka POS — ${{ steps.meta.outputs.tag }}

            ### 📦 Downloads (Windows 8, 8.1, 10, 11)

            | Platform | File | Notes |
            |----------|------|-------|
            | 🪟 Windows | `Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe` | Universal standalone installer for Windows 8, 8.1, 10, and 11 |

            ### 🚀 Windows Installation
            1. Download `Beleka_POS_Setup_v${{ steps.meta.outputs.version }}.exe`
            2. Run the installer (Right-click → **Run as administrator**)
            3. Follow the setup wizard — all Microsoft runtimes for Windows 8, 10, and 11 are installed automatically.

            ---
            *Built automatically by GitHub Actions · `${{ github.sha }}`*

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build Windows installer (Windows 8, 8.1, 10, 11)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ needs.create-release.outputs.version }}

      - name: Copy MSVC runtime & UCRT DLLs
        shell: pwsh
        run: |
          $target = "build\windows\x64\runner\Release"
          $dlls = @(
            "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll",
            "msvcp140_1.dll", "msvcp140_2.dll", "vcomp140.dll", "concrt140.dll",
            "ucrtbase.dll"
          )
          foreach ($dll in $dlls) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) { Copy-Item $src $target -Force; Write-Host "Copied $dll" }
          }
          Get-ChildItem "C:\Windows\System32\api-ms-win-crt-*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName $target -Force
          }
          Get-ChildItem "C:\Windows\System32\api-ms-win-core-*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName $target -Force
          }
          Write-Host "All Windows compatibility DLLs bundled."

      - name: Download Official Microsoft Visual C++ Redistributable
        shell: pwsh
        run: |
          $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          Invoke-WebRequest -Uri $vcRedistUrl -OutFile "windows\vc_redist.x64.exe"
          Write-Host "Downloaded Microsoft vc_redist.x64.exe for Inno Setup installer bundling."

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $ver  = "${{ needs.create-release.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          (Get-Content "windows\installer.iss") `
            -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" |
            Set-Content "windows\installer.iss"
          New-Item -ItemType Directory -Path "build\windows\installer" -Force | Out-Null
          & $iscc "windows\installer.iss"
          Write-Host "Built: Beleka_POS_Setup_v$ver.exe"

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: build/windows/installer/Beleka_POS_Setup_v${{ needs.create-release.outputs.version }}.exe

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Publish the release
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Publish (undraft) release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false
