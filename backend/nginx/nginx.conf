events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Formats
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # Security & Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;

    upstream fastapi_app {
        server backend_api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        # Max payload size for bulk sync operations (e.g. 50MB)
        client_max_body_size 50M;

        location / {
            limit_req zone=api_rate_limit burst=20 nodelay;

            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;

            # Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket & Server-Sent Events Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout configurations
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health Check Endpoint
        location /nginx-health {
            access_log off;
            return 200 "Nginx Gateway Healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
