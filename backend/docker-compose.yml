version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: beleka_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: beleka_cloud_secret_password
      POSTGRES_DB: beleka_pos_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: beleka_redis_cache
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend_api:
    build: .
    container_name: beleka_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:beleka_cloud_secret_password@postgres:5432/beleka_pos_cloud
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: beleka_nginx_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_api

volumes:
  postgres_data:
  redis_data:
