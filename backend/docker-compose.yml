version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: beleka_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: beleka_cloud_secret_password
      POSTGRES_DB: beleka_pos_cloud
    ports:
      - "5434:5432"
    volumes:
      - beleka_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d beleka_pos_cloud" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beleka_redis_cache
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6381:6379"
    volumes:
      - beleka_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_api:
    build: .
    container_name: beleka_fastapi_backend
    restart: always
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:beleka_cloud_secret_password@postgres:5432/beleka_pos_cloud
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: beleka_nginx_gateway
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_api

volumes:
  beleka_postgres_data:
  beleka_redis_data:

